<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Music Wordle</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body class="wordlePage">

<header class="appHeader">
  <div class="appHeaderInner">
    <button id="homeBtn" class="homeButton" onclick="goHome()" aria-label="Torna alla home">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12 L12 3 L21 12"></path>
        <path d="M6 12 V21 H18 V12"></path>
      </svg>
    </button>
    <div class="headerBrand">
      <span class="headerEyebrow">Allenamento musicale</span>
      <h1 class="pageTitle">Music Wordle</h1>
    </div>
  </div>
</header>

<!-- ==================== CONTENITORE PRINCIPALE ==================== -->
<div id="contentWrapper">

  <!-- ==================== SELEZIONE MODALITÀ ==================== -->
  <div id="config">
    <h2>Seleziona Modalità</h2>
    <div class="buttonGroup">
      <button class="menuButton" onclick="selectMode(this,'easy')">Facile</button>
      <button class="menuButton" onclick="selectMode(this,'medium')">Medio</button>
      <button class="menuButton" onclick="selectMode(this,'hard')">Difficile</button>
    </div>
    <button class="menuButton" onclick="startGame()">Start</button>
    <p class="gameIntro">Indovina la parola musicale nascosta in 6 tentativi scegliendo lettere dalla tastiera.</p>
  </div>

  <!-- ==================== GIOCO ==================== -->
  <div id="game" class="hidden">
    <div id="grid"></div>
    <div class="wordleLane">
      <div id="keyboard"></div>
      <div id="message" class="messageText"></div>
    </div>
  </div>

</div>

<script src="js/wordle.js"></script>
</body>
</html>
