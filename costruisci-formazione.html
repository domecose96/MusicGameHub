<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costruisci la Formazione | Music Game Hub</title>

  <link rel="icon" type="image/png" href="img/mgh-logo.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/costruisci-formazione.css">
</head>

<body class="costruisciFormPage">

<header class="appHeader">
  <div class="appHeaderInner">
    <button id="homeBtn" class="homeButton" onclick="MGH.goHome()" aria-label="Torna alla home">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12 L12 3 L21 12"></path>
        <path d="M6 12 V21 H18 V12"></path>
      </svg>
    </button>

    <div class="headerBrand">
      <span class="headerEyebrow">Crea la tua</span>
      <h1 class="pageTitle">Costruisci la Formazione</h1>
    </div>
  </div>
</header>

<div id="contentWrapper">

  <!-- ==================== STRUMENTI CAROUSEL ==================== -->
  <section id="carouselSection" class="carouselSection">
    <div class="carouselContainer">
      <button class="carouselArrow carouselArrowLeft" id="arrowLeft" onclick="scrollCarousel(-1)">‹</button>
      
      <div class="carouselWrapper" id="carouselWrapper">
        <div class="instrumentsCarousel" id="instrumentsCarousel">
          <!-- Generato da JS -->
        </div>
      </div>

      <button class="carouselArrow carouselArrowRight" id="arrowRight" onclick="scrollCarousel(1)">›</button>
    </div>
  </section>

  <!-- ==================== STAGE E AREA DROP ==================== -->
  <section id="stageSection" class="stageSectionContainer">
    <div class="stageCard">
      
      <div class="stageWrapper" id="stageDropZone">
        <img src="img/formazioni/stage.webp" alt="Palco" class="stageImage">
        <div class="instrumentsOnStage" id="instrumentsOnStage">
          <!-- Strumenti trascinati appaiono qui -->
        </div>
      </div>

      <div class="formazioneResult">
        <h3 id="resultName">Scegli gli strumenti</h3>
        <p id="resultDescription" class="resultDesc"></p>
      </div>

    </div>
  </section>

  <!-- ==================== AZIONI ==================== -->
  <section id="actionsSection" class="actionsSection">
    <button class="actionBtn resetBtn" onclick="resetStage()">🔄 Ricomincia</button>
    <a href="formazioni.html" class="actionBtn backBtn">← Torna alle Formazioni</a>
  </section>

</div>

<!-- SCROLL TOP BUTTON -->
<button id="scrollTopBtn" class="scrollTopBtn" title="Torna in alto">↑</button>

<script src="js/common.js"></script>
<script src="js/costruisci-formazione.js"></script>
<script data-goatcounter="https://musicgamehub.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</body>
</html>
