<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mozart a fumetti | Music Game Hub</title>
<link rel="icon" type="image/png" href="../img/mgh-logo.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/learn.css">
<link rel="stylesheet" href="../css/fumetti/reader.css">
</head>

<body class="comicReaderPage"
      data-comic-slug="mozart"
      data-comic-title="Mozart"
      data-comic-volume="01"
      data-comic-cover="mozart.webp"
      data-comic-back="mozart_back.webp"
      data-comic-alt="Mozart">

<header class="appHeader">
  <div class="appHeaderInner">
    <button id="homeBtn" class="homeButton" onclick="MGH.goHome()" aria-label="Torna alla home">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12 L12 3 L21 12"></path>
        <path d="M6 12 V21 H18 V12"></path>
      </svg>
    </button>

    <div class="headerBrand">
      <span class="headerEyebrow">Vite a fumetti · Volume 01</span>
      <h1 class="pageTitle">Mozart</h1>
    </div>
  </div>
</header>

<nav id="siteNav" class="theoryNav readerNav" aria-label="Comandi lettura Mozart">
  <button id="firstPage" class="navBtn" type="button">Prima pagina</button>
  <button id="spreadMode" class="navBtn" type="button" aria-pressed="false">Due pagine</button>
  <button id="fullscreenPage" class="navBtn" type="button">Lettura grande</button>
  <button id="lastPage" class="navBtn" type="button">Ultima pagina</button>

  <div class="readerCounter" aria-live="polite">
    <strong id="pageTitle">Copertina</strong>
    <span id="pageCounter">1 / 34</span>
  </div>
</nav>

<main id="contentWrapper">
  <section id="reader" class="siteSection readerSection" aria-label="Lettore fumetto Mozart">
    <div class="readerLayout">
      <button id="prevPage" class="pageTurn pageTurnPrev" type="button" aria-label="Pagina precedente">
        <span aria-hidden="true">⇧</span>
      </button>

      <div class="comicStage">
        <div id="pageSpread" class="pageSpread">
          <article class="comicPageFrame">
            <img id="comicImage" src="../img/fumetti/mozart/mozart.webp" alt="Copertina del fumetto su Mozart">
            <div id="comicPlaceholder" class="comicPlaceholder" hidden>
              <span id="placeholderNumber">01</span>
              <h3 id="placeholderTitle">Copertina</h3>
              <p id="placeholderText">Inserisci qui la prima tavola del fumetto in formato 9:16.</p>
            </div>
          </article>

          <article id="secondPageFrame" class="comicPageFrame secondPageFrame" hidden>
            <img id="secondComicImage" src="../img/fumetti/mozart/01.webp" alt="Seconda tavola del fumetto su Mozart">
          </article>
        </div>
      </div>

      <button id="nextPage" class="pageTurn pageTurnNext" type="button" aria-label="Pagina successiva">
        <span aria-hidden="true">⇧</span>
      </button>
    </div>
  </section>
</main>

<button id="scrollTopBtn" aria-label="Torna in alto">⇧</button>

<script src="../js/common.js"></script>
<script src="../js/fumetti/reader.js"></script>
<script data-goatcounter="https://musicgamehub.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
