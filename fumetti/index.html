<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vite a fumetti | Music Game Hub</title>
<link rel="icon" type="image/png" href="../img/mgh-logo.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/learn.css">
<link rel="stylesheet" href="../css/fumetti/index.css">
</head>

<body class="comicsIndexPage">

<header class="appHeader">
  <div class="appHeaderInner">
    <button id="homeBtn" class="homeButton" onclick="MGH.goHome()" aria-label="Torna alla home">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12 L12 3 L21 12"></path>
        <path d="M6 12 V21 H18 V12"></path>
      </svg>
    </button>

    <div class="headerBrand">
      <span class="headerEyebrow">Collana illustrata</span>
      <h1 class="pageTitle">Vite a fumetti</h1>
    </div>
  </div>
</header>

<main id="contentWrapper">
  <section id="collana" class="siteSection librarySection">
    <div class="libraryRoom" aria-label="Scaffale dei fumetti musicali">
      <div class="shelfLabel">
        <div id="comicAvailability" class="comicAvailability">Caricamento volumi...</div>
      </div>

      <div class="catalogFrame">
        <button class="catalogArrow catalogArrowPrev" type="button" aria-label="Scorri catalogo a sinistra">
          <span aria-hidden="true">⇧</span>
        </button>

        <div class="bookShelf" id="bookShelf" aria-live="polite"></div>

        <button class="catalogArrow catalogArrowNext" type="button" aria-label="Scorri catalogo a destra">
          <span aria-hidden="true">⇧</span>
        </button>
      </div>

      <div class="shelfBoard" aria-hidden="true"></div>
    </div>
  </section>
</main>

<button id="scrollTopBtn" aria-label="Torna in alto">⇧</button>

<script src="../js/common.js"></script>
<script src="../js/fumetti/index.js"></script>
<script data-goatcounter="https://musicgamehub.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
