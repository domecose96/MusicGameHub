<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Pagina non trovata | Music Game Hub</title>
<meta name="robots" content="noindex, follow">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">

<style>
.errorPage {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(circle at top, rgba(255,102,0,0.12), transparent 34%),
    var(--bg-main);
}

.errorMain {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 20px 40px;
}

.errorBox {
  width: 100%;
  max-width: 620px;
  text-align: center;
  background: var(--surface-solid);
  border-radius: 28px;
  box-shadow: var(--panel-shadow);
  padding: 42px 28px;
}

.errorIcon {
  font-size: 3rem;
  display: block;
  margin-bottom: 12px;
}

.errorCode {
  font-size: clamp(5rem, 18vw, 9rem);
  line-height: 1;
  color: rgba(255,102,0,0.18);
  font-weight: 900;
  position: relative;
}

.errorCode::after {
  content: "404";
  position: absolute;
  inset: 0;
  color: var(--accent);
  clip-path: inset(0 0 45% 0);
}

.errorTitle {
  color: var(--text-main);
  font-size: clamp(1.45rem, 4vw, 2rem);
  margin: 8px 0 12px;
}

.errorDesc {
  max-width: 420px;
  margin: 0 auto 28px;
  color: var(--text-muted);
  line-height: 1.65;
}

.errorActions {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
}

.errorActions .menuButton {
  min-width: 190px;
  padding: 13px 20px;
  text-decoration: none;
}

.errorFooter {
  text-align: center;
  color: var(--text-muted);
  font-size: .85rem;
  padding: 22px;
}
</style>
</head>

<body class="errorPage">

<header class="appHeader">
  <div class="appHeaderInner">
    <div class="headerBrand">
      <span class="headerEyebrow">Hub musicale</span>
      <h1 class="pageTitle">Music Game Hub</h1>
    </div>
  </div>
</header>

<main class="errorMain">
  <div class="errorBox">

    <span class="errorIcon">🎼</span>
    <div class="errorCode">404</div>

    <h1 class="errorTitle">Pagina fuori pentagramma</h1>

    <p class="errorDesc">
      Il link che hai seguito potrebbe essere sbagliato o la pagina non esiste più.
    </p>

    <div class="errorActions">
      <a href="index.html" class="menuButton">Torna alla home</a>
      <a href="music_game.html" class="menuButton">Gioca con le note</a>
    </div>

  </div>
</main>

<footer class="errorFooter">
  <strong>Music Game Hub</strong> — Impara la teoria musicale giocando.
</footer>

</body>
</html>
