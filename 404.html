<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Pagina non trovata | Music Game Hub</title>
<meta name="robots" content="noindex, follow">

<link rel="stylesheet" href="css/404.css">
</head>

<body class="errorPage">

<header class="appHeader">
  <span class="headerEyebrow">Hub musicale</span>
  <h1 class="pageTitle">Music Game Hub</h1>
</header>

<main class="errorMain">
  <section class="errorBox">

    <div class="errorCode">404</div>

    <h1 class="errorTitle">Pagina fuori pentagramma</h1>

    <p class="errorDesc">
      Il link potrebbe essere sbagliato oppure la pagina è stata spostata.
      Intanto… salta le note!
    </p>

    <div class="miniGameBox">
      <div class="gameHeader">
        <h2>Corsa sul pentagramma</h2>
        <div class="gameScore">Punteggio: <span id="runnerScore">0</span></div>
      </div>

      <canvas id="staffRunnerCanvas" width="560" height="170"></canvas>

      <p class="gameHint">Tocca o premi spazio per saltare</p>
    </div>

    <div class="errorActions">
      <a href="/MusicGameHub/" class="menuButton">← Home</a>
      <a href="/MusicGameHub/mappa.html" class="menuButton secondary">🗺️ Mappa</a>
    </div>

  </section>
</main>

<script src="js/404.js"></script>
</body>
</html>
