<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mappa delle risorse | Music Game Hub</title>
<link rel="icon" type="image/png" href="img/mgh-logo.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/mappa.css">
</head>
<body>

<header class="appHeader">
  <div class="appHeaderInner">
    <button id="homeBtn" class="homeButton" onclick="goHome()" aria-label="Torna alla home">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12 L12 3 L21 12"></path>
        <path d="M6 12 V21 H18 V12"></path>
      </svg>
    </button>

    <div class="headerBrand">
      <span class="headerEyebrow">Hub musicale</span>
      <h1 class="pageTitle">Mappa delle risorse</h1>
    </div>
  </div>
</header>

<nav class="toolbar">
  <div class="filterDock">
    <button class="filterBtn active" data-filter="all">Tutto</button>
    <button class="filterBtn" data-filter="theory">📘 Teoria</button>
    <button class="filterBtn" data-filter="paths">🧭 Percorsi</button>
    <button class="filterBtn" data-filter="games">🎮 Giochi</button>
    <span class="dockDivider"></span>
    <button class="filterBtn" data-action="reset">↺ Reset vista</button>
  </div>
</nav>

<main>
  <section class="mapViewport">
    <div class="mapCanvas structuredMap" id="mapCanvas">
      <button class="node rootNode" data-root="true">
        <div class="nodeIcon">🎼</div>
        <h2>Music Game Hub</h2>
        <p>torna alla home</p>
      </button>

      <div class="mapColumns">
        <section class="mapColumn mapColumnTheory">
          <button class="node categoryNode cat-theory" data-category-node="theory">
            <div class="nodeIcon">📘</div><h3>Teoria</h3><p>3 risorse principali</p>
          </button>
          <div class="mapResourceGrid">
            <button class="node resourceNode featured" data-id="elementiMusica" data-type="theory">
              <span class="featuredRibbon">★ nuovo</span><span class="badge theory">Teoria</span><div class="resourceIcon">〰</div><h4>Suono ed elementi</h4><p>Onde e udito</p>
            </button>
            <article class="resourceCluster clusterFromRight" data-type="theory">
              <button class="node resourceNode clusterToggle" data-id="teoriaBase" data-type="theory" data-toggle-cluster="teoriaBase" aria-expanded="false">
                <span class="badge theory">Teoria</span><div class="resourceIcon">📚</div><h4>Teoria musicale</h4><p>Pentagramma, note, ritmo e simboli</p><span class="clusterHint">Apri argomenti</span>
              </button>
              <div class="clusterLinks" id="cluster-teoriaBase" aria-label="Argomenti di teoria musicale" hidden>
                <button type="button" data-id="pentagramma">Pentagramma</button>
                <button type="button" data-id="chiavi">Chiavi</button>
                <button type="button" data-id="note">Note</button>
                <button type="button" data-id="figure">Figure</button>
                <button type="button" data-id="tempi">Tempi</button>
                <button type="button" data-id="scale">Scale</button>
                <button type="button" data-id="simboli">Simboli</button>
                <button type="button" data-id="espressione">Espressione</button>
              </div>
            </article>
            <article class="resourceCluster" data-type="theory">
              <button class="node resourceNode featured clusterToggle" data-id="teoriaAvanzata" data-type="theory" data-toggle-cluster="teoriaAvanzata" aria-expanded="false">
                <span class="featuredRibbon">★ avanzata</span><span class="badge theory">Teoria</span><div class="resourceIcon">🧠</div><h4>Teoria avanzata</h4><p>Accordi, forme e armonia</p><span class="clusterHint">Apri argomenti</span>
              </button>
              <div class="clusterLinks" id="cluster-teoriaAvanzata" aria-label="Argomenti di teoria avanzata" hidden>
                <button type="button" data-id="intervalliAvanzati">Intervalli</button>
                <button type="button" data-id="accordiAvanzati">Accordi</button>
                <button type="button" data-id="rivoltiAvanzati">Rivolti</button>
                <button type="button" data-id="scaleMinoriAvanzate">Scale minori</button>
                <button type="button" data-id="circoloQuinte">Circolo quinte</button>
                <button type="button" data-id="cadenzeAvanzate">Cadenze</button>
                <button type="button" data-id="modulazioniAvanzate">Modulazioni</button>
                <button type="button" data-id="ritmicaAvanzata">Ritmica</button>
                <button type="button" data-id="abbellimentiAvanzati">Abbellimenti</button>
                <button type="button" data-id="formaAvanzata">Forma</button>
              </div>
            </article>
          </div>
        </section>

        <section class="mapColumn mapColumnPaths">
          <button class="node categoryNode cat-paths" data-category-node="paths">
            <div class="nodeIcon">🧭</div><h3>Percorsi</h3><p>4 risorse principali</p>
          </button>
          <div class="mapResourceGrid">
            <button class="node resourceNode featured" data-id="storiaMusica" data-type="paths">
              <span class="featuredRibbon">★ timeline</span><span class="badge paths">Percorso</span><div class="resourceIcon">🕰️</div><h4>Storia</h4><p>Epoche e autori</p>
            </button>
            <button class="node resourceNode" data-id="strumentiMusicali" data-type="paths">
              <span class="badge paths">Percorso</span><div class="resourceIcon">🎺</div><h4>Strumenti</h4><p>Famiglie e gioco</p>
            </button>
            <button class="node resourceNode featured" data-id="fumettiMusicali" data-type="paths">
              <span class="featuredRibbon">★ collana</span><span class="badge paths">Percorso</span><div class="resourceIcon">📖</div><h4>Vite a fumetti</h4><p>Compositori</p>
            </button>
            <button class="node resourceNode featured" data-id="educazioneCivica" data-type="paths">
              <span class="featuredRibbon">★ indice</span><span class="badge paths">Percorso</span><div class="resourceIcon">🌍</div><h4>Educazione civica</h4><p>Indice lezioni</p>
            </button>
          </div>
        </section>

        <section class="mapColumn mapColumnGames">
          <button class="node categoryNode cat-games" data-category-node="games">
            <div class="nodeIcon">🎮</div><h3>Giochi</h3><p>6 risorse</p>
          </button>
          <div class="mapResourceGrid">
            <button class="node resourceNode featured" data-id="pentagrammaGame" data-type="games">
              <span class="featuredRibbon">★ nuovo</span><span class="badge games">Gioco</span><div class="resourceIcon">🎯</div><h4>Orientati</h4><p>Sul pentagramma</p>
            </button>
            <button class="node resourceNode" data-id="noteGame" data-type="games">
              <span class="badge games">Gioco</span><div class="resourceIcon">𝄞</div><h4>Impara le Note</h4><p>Violino e basso</p>
            </button>
            <button class="node resourceNode" data-id="figuresGame" data-type="games">
              <span class="badge games">Gioco</span><div class="resourceIcon">♩</div><h4>Figure Musicali</h4><p>Riconoscimento</p>
            </button>
            <button class="node resourceNode" data-id="wordle" data-type="games">
              <span class="badge games">Gioco</span><div class="resourceIcon">W</div><h4>Music Wordle</h4><p>Vocabolario</p>
            </button>
            <button class="node resourceNode" data-id="guanto" data-type="games">
              <span class="badge games">Gioco</span><div class="resourceIcon">🏆</div><h4>Guanto Sfida</h4><p>Quiz misto</p>
            </button>
            <button class="node resourceNode featured" data-id="ritmo" data-type="games">
              <span class="featuredRibbon">★ ritmo</span><span class="badge games">Gioco</span><div class="resourceIcon">♪</div><h4>Conta le pulsazioni</h4><p>Valori ritmici</p>
            </button>
          </div>
        </section>
      </div>
    </div>
  </section>

  <section id="mobileList" class="mobileList"></section>
</main>

<div class="legend">
  <div><span class="legendDot theory"></span> Teoria</div>
  <div><span class="legendDot paths"></span> Percorsi</div>
  <div><span class="legendDot games"></span> Giochi</div>
  <div><span class="legendDot featured"></span> In evidenza</div>
</div>

<div class="zoomControls">
  <button id="zoomIn" type="button">+</button>
  <button id="zoomOut" type="button">−</button>
  <button id="zoomReset" type="button">⌂</button>
</div>

<div class="modalOverlay" id="modalOverlay">
  <article class="resourceModal">
    <button class="modalClose" id="modalClose" type="button">×</button>
    <div class="modalIcon" id="modalIcon"></div>
    <div class="modalType" id="modalType"></div>
    <h2 class="modalTitle" id="modalTitle"></h2>
    <p class="modalDesc" id="modalDesc"></p>
    <div class="tagList" id="modalTags"></div>
    <a class="modalAction" id="modalLink" href="#">Apri la risorsa →</a>
  </article>
</div>

<footer class="siteLegalFooter">
  <p>Music Game Hub tutela la privacy e usa solo strumenti tecnici o statistici necessari al portale.</p>
  <div class="siteLegalLinks">
    <a href="legal/privacy.html">Privacy Policy</a>
    <span>·</span>
    <a href="legal/cookie.html">Cookie Policy</a>
    <span>·</span>
    <a href="legal/termini.html">Termini di servizio</a>
  </div>
</footer>

<script src="js/common.js"></script>
<script src="js/resources.js"></script>
<script src="js/fumetti/catalog.js"></script>
<script src="js/mappa.js"></script>
<script data-goatcounter="https://musicgamehub.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
