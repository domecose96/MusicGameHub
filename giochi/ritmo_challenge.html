<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Ritmo Challenge</title>
<link rel="icon" type="image/png" href="../img/mgh-logo.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/giochi/ritmo.css">
</head>

<body class="ritmoPage">

<button id="rankedLeaderboardBtn"
        class="rankedLeaderboardButton"
        onclick="showGenericRankedLeaderboardModal('ritmo')"
        aria-label="Classifica">
  🏆
</button>

<header class="appHeader">
  <div class="appHeaderInner">
    <button id="homeBtn" class="homeButton" onclick="goHome()" aria-label="Torna alla home">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12 L12 3 L21 12"></path>
        <path d="M6 12 V21 H18 V12"></path>
      </svg>
    </button>
    <div class="headerBrand">
      <span class="headerEyebrow">Allenamento musicale</span>
      <h1 class="pageTitle">Ritmo Challenge</h1>
      <span id="headerModeLabel" class="headerModeLabel hidden"></span>
    </div>
  </div>
</header>

<div id="contentWrapper">
  <div id="menu">
    <h2>Scegli la difficoltà</h2>
    <div class="buttonGroup">
      <button class="menuButton" onclick="setDifficulty('easy', this)">Facile</button>
      <button class="menuButton" onclick="setDifficulty('medium', this)">Medio</button>
      <button class="menuButton" onclick="setDifficulty('hard', this)">Difficile</button>
      <button class="menuButton rankedModeButton" onclick="selectRankedMode(this)">
        <span class="dailyModeBadge">Ranked</span>
        Classificata
      </button>
    </div>
    <button class="menuButton" onclick="startGame()">Inizia</button>
    <p id="warning" class="warningText"></p>
    <p class="rhythmLegend">Guarda la sequenza di figure musicali e scegli quante pulsazioni totali vale.</p>
  </div>

  <div id="game" class="hidden">
    <div id="rankedUI" class="rankedUI hidden">
      <div class="rankedScoreDisplay">Score: <span id="rankedScore">0</span></div>
      <div class="rankedProgressWrapper">
        <div class="rankedProgressLabel">
          <span>Progressione</span>
          <span id="rankedQuestionCounter">1/10</span>
        </div>
        <div class="rankedProgressBar">
          <div id="rankedProgressFill" class="rankedProgressFill"></div>
        </div>
      </div>
    </div>
    <h2>Quante pulsazioni vale questa sequenza?</h2>
    <div id="rhythmSequence" class="rhythmSequence"></div>
    <div id="rhythmInfo" class="rhythmInfo"></div>
    <div id="answers"></div>
    <button onclick="goBack()" class="menuButton" style="margin-top:15px;">⬅ Indietro</button>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/giochi/ranked.js"></script>
<script src="../js/giochi/ritmo_challenge.js"></script>
<script data-goatcounter="https://musicgamehub.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</body>
</html>
