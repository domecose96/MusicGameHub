<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Guanto di Sfida</title>
<link rel="icon" type="image/png" href="../img/mgh-logo.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/giochi/guanto.css">
</head>
<body class="guantoPage">

<button id="rankedLeaderboardBtn"
        class="rankedLeaderboardButton"
        onclick="showGenericRankedLeaderboardModal('guanto')"
        aria-label="Classifica">
  🏆
</button>

<header class="appHeader">
  <div class="appHeaderInner">
    <button id="homeBtn" class="homeButton" onclick="goHome()" aria-label="Torna alla home">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12 L12 3 L21 12"></path>
        <path d="M6 12 V21 H18 V12"></path>
      </svg>
    </button>
    <div class="headerBrand">
      <span class="headerEyebrow">Allenamento musicale</span>
      <h1 class="pageTitle">Guanto di Sfida</h1>
      <span id="headerModeLabel" class="headerModeLabel hidden"></span>
    </div>
  </div>
</header>

<!-- ==================== CONTENITORE PRINCIPALE ==================== -->
<div id="contentWrapper">
  <!-- ==================== CONFIGURAZIONE MODALITÀ ==================== -->
  <div id="config" class="gameModeMenu">
    <h2>Scegli la modalità</h2>
    <div class="buttonGroup">
      <button class="menuButton" onclick="selectNum(this,10)">10</button>
      <button class="menuButton" onclick="selectNum(this,20)">20</button>
      <button class="menuButton" onclick="selectNum(this,30)">30</button>
      <button class="menuButton rankedModeButton" onclick="selectRankedChallenge(this)">
        <span class="dailyModeBadge">Ranked</span>
        Classificata
      </button>
    </div>
    <div class="guantoActions">
      <button class="menuButton startButton" onclick="startChallenge()">Inizia</button>
      <button class="menuButton" onclick="showGenericRankedLeaderboardModal('guanto')">Classifica</button>
    </div>
    <p class="warningText introSpacer"></p>
    <p class="gameIntro">Affronta una serie di domande miste su note, figure e teoria musicale cercando di fare meno errori possibile.</p>
  </div>

  <!-- ==================== SCHERMATA QUIZ ==================== -->
  <div id="quiz" class="hidden">
    <div id="rankedUI" class="rankedUI hidden">
      <div class="rankedScoreDisplay">Score: <span id="rankedScore">0</span></div>
      <div class="rankedProgressWrapper">
        <div class="rankedProgressLabel">
          <span>Progressione</span>
          <span id="rankedQuestionCounter">1/10</span>
        </div>
        <div class="rankedProgressBar">
          <div id="rankedProgressFill" class="rankedProgressFill"></div>
        </div>
      </div>
    </div>
    <div id="timer">Tempo: 0s</div>
    <div id="questionBox" class="questionBox"></div>

    <!-- SVG PENTAGRAMMA -->
    <svg id="quizSVG" class="gameVisualBox" viewBox="0 0 450 240">
      <!-- CHIAVE -->
      <text id="clefSymbol" x="175" y="140" font-size="80" font-family="serif">𝄞</text>

      <!-- LINEE PENTAGRAMMA -->
      <line x1="175" y1="140" x2="280" y2="140" stroke="black"/>
      <line x1="175" y1="130" x2="280" y2="130" stroke="black"/>
      <line x1="175" y1="120" x2="280" y2="120" stroke="black"/>
      <line x1="175" y1="110" x2="280" y2="110" stroke="black"/>
      <line x1="175" y1="100" x2="280" y2="100" stroke="black"/>

      <!-- NOTA -->
      <ellipse id="note" cx="225" cy="120" rx="10" ry="7" fill="black"/>
      <g id="ledgerLines"></g>
    </svg>
    
    <!-- FIGURA MUSICALE -->
    <div id="figureContainer" class="gameDisplay gameVisualBox hidden">
        <img id="figureImage" src="" alt="Figura musicale" class="figureImage">
    </div>
    
    <!-- BOTTONI RISPOSTA -->
    <div id="answers"></div>
  </div>

  <!-- ==================== FINE PARTITA / CLASSIFICHE ==================== -->
  <div id="endScreen" class="hidden">

    <h2 id="scoreText"></h2>

    <div id="saveScoreBox" class="saveBox hidden"></div>

    <div id="leaderboardsContainer" class="leaderboards hidden">

      <div class="leaderboardColumn">
        <h3>🎼 Modalità 10</h3>
        <div id="lb_note" class="leaderboardBox"></div>
      </div>

      <div class="leaderboardColumn">
        <h3>🎵 Modalità 20</h3>
        <div id="lb_teoria" class="leaderboardBox"></div>
      </div>

      <div class="leaderboardColumn">
        <h3>🔥 Modalità 30</h3>
        <div id="lb_sfida" class="leaderboardBox"></div>
      </div>

    </div>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/giochi/ranked.js"></script>
<script src="../js/giochi/sfida/guanto.js"></script>
<script data-goatcounter="https://musicgamehub.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</body>
</html>
