<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Gioco Note Completo</title>
<link rel="icon" type="image/png" href="../img/mgh-logo.png">
<link rel="stylesheet" href="../css/base.css">
</head>

<body class="gamePage rankedUnifiedGamePage">

<button id="rankedLeaderboardBtn"
        type="button"
        class="rankedLeaderboardButton"
        onclick="showGenericRankedLeaderboardModal('note')"
        aria-label="Classifica">
  🏆
</button>

<header class="appHeader">
  <div class="appHeaderInner">
    <button id="homeBtn" class="homeButton" type="button" onclick="goHome()" aria-label="Torna alla home">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12 L12 3 L21 12"></path>
        <path d="M6 12 V21 H18 V12"></path>
      </svg>
    </button>
    <div class="headerBrand">
      <span class="headerEyebrow">Allenamento musicale</span>
      <h1 class="pageTitle">Gioco delle Note</h1>
      <span id="headerModeLabel" class="headerModeLabel hidden"></span>
    </div>
  </div>
</header>

<!-- ==================== CONTENITORE PRINCIPALE ==================== -->
<div id="contentWrapper">

  <!-- ==================== MENU INIZIALE ==================== -->
  <div id="menu" class="gameModeMenu">

    <h2>Scegli la modalità</h2>
    <div class="buttonGroup">
      <button id="easyBtn" class="menuButton" type="button" onclick="setDifficulty('easy',this)">Facile</button>
      <button id="mediumBtn" class="menuButton" type="button" onclick="setDifficulty('medium',this)">Medio</button>
      <button id="hardBtn" class="menuButton" type="button" onclick="setDifficulty('hard',this)">Difficile</button>
      <button class="menuButton rankedModeButton" type="button" onclick="selectRankedMode(this)">
        <span class="dailyModeBadge">Ranked</span>
        Classificata
      </button>
    </div>

    <h3 class="modeSubTitle">Chiave</h3>
    <div class="buttonGroup">
      <button id="trebleBtn" class="symbolButton" type="button" onclick="setClef('treble',this)">𝄞</button>
      <button id="bassBtn" class="symbolButton" type="button" onclick="setClef('bass',this)">𝄢</button>
    </div>

    <button class="menuButton startButton" type="button" onclick="startGame()">Inizia</button>
    <p id="warning" class="warningText"></p>
    <p class="gameIntro">Scegli difficoltà e chiave, poi indovina il nome della nota mostrata sul pentagramma.</p>

  </div>

  <!-- ==================== SCHERMATA DI GIOCO ==================== -->
  <div id="game" class="hidden">

    <div class="gameTopActions">
      <button id="backButton" class="menuButton compactBackButton" type="button" onclick="goBack()" aria-label="Torna alla scelta modalità">
        <span aria-hidden="true">⇧</span>
      </button>
    </div>

    <div id="questionBox" class="gameQuestionBox">
      <span id="questionText">Come si chiama questa nota?</span>
    </div>

    <!-- SVG PENTAGRAMMA -->
    <svg class="gameVisualBox" viewBox="0 0 450 240">

      <!-- CHIAVE -->
      <text id="clefSymbol" x="175" y="140" font-size="80" font-family="serif">𝄞</text>

      <!-- PENTAGRAMMA -->
      <line x1="175" y1="140" x2="280" y2="140" stroke="black"/>
      <line x1="175" y1="130" x2="280" y2="130" stroke="black"/>
      <line x1="175" y1="120" x2="280" y2="120" stroke="black"/>
      <line x1="175" y1="110" x2="280" y2="110" stroke="black"/>
      <line x1="175" y1="100" x2="280" y2="100" stroke="black"/>

      <!-- NOTA -->
      <ellipse id="note" cx="230" cy="120" rx="10" ry="7" fill="black"/>
      <g id="ledgerLines"></g>

    </svg>

    <!-- BOTTONI NOTE -->
    <div id="buttons"></div>
    <div id="feedback" class="feedbackText"></div>

  </div>
</div>


<script src="../js/common.js"></script>
<script src="../js/giochi/ranked.js"></script>
<script src="../js/giochi/game_ui.js"></script>
<script src="../js/giochi/music_game.js"></script>
<script data-goatcounter="https://musicgamehub.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</body>
</html>
