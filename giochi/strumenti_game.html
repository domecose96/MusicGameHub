<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strumenti Musicali Game</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/giochi/strumenti_game.css?v=20260620-central12">
</head>

<body class="strumentiGamePage rankedUnifiedGamePage">

<button id="rankedLeaderboardBtn"
        class="rankedLeaderboardButton"
        onclick="showGenericRankedLeaderboardModal('strumenti')"
        aria-label="Classifica">
  🏆
</button>

<header class="appHeader">
  <div class="appHeaderInner">
    <button id="homeBtn" class="homeButton" onclick="goHome()" aria-label="Torna alla home">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12 L12 3 L21 12"></path>
        <path d="M6 12 V21 H18 V12"></path>
      </svg>
    </button>

    <div class="headerBrand">
      <span class="headerEyebrow">Allenamento musicale</span>
      <h1 class="pageTitle">Strumenti Musicali</h1>
      <span id="headerModeLabel" class="headerModeLabel hidden"></span>
    </div>
  </div>
</header>

<div id="contentWrapper">

  <!-- MENU PRINCIPALE -->
  <div id="menu" class="gameModeMenu">
    <h2>Scegli la modalità</h2>

    <div class="buttonGroup strumentiModeGroup">
      <button class="menuButton gameTypeButton" onclick="selectGameMode('recognize', this)">
        Riconosci lo Strumento
      </button>
      <button class="menuButton gameTypeButton" onclick="selectGameMode('memory', this)">
        Memory Strumenti
      </button>
      <button class="menuButton gameTypeButton" onclick="selectGameMode('listen', this)">
        Ascolta e Riconosci
      </button>
      <button class="menuButton rankedModeButton" onclick="selectMode(this, 'ranked')">
        <span class="dailyModeBadge">Ranked</span>
        Classificata
      </button>
    </div>

    <button class="menuButton startButton" onclick="startGame()">Inizia</button>

    <p id="warning" class="warningText"></p>
    <p class="gameIntro">
      Scegli una modalità e mettiti alla prova con strumenti musicali da tutto il mondo. Sfida te stesso in modalità classificata e conquista la classifica!
    </p>
  </div>

  <!-- AREA DI GIOCO -->
  <div id="game" class="hidden">

    <!-- RANKED UI -->
    <div id="rankedUI" class="rankedUI hidden">
      <div id="rankedScoreDisplay" class="rankedScoreDisplay">
        Score: <span id="rankedScore">0</span>
      </div>
      <div id="rankedProgressWrapper" class="rankedProgressWrapper">
        <div id="rankedProgressLabel" class="rankedProgressLabel">
          <span>Progressione</span>
          <span id="rankedQuestionCounter">1/10</span>
        </div>
        <div id="rankedProgressBar" class="rankedProgressBar">
          <div id="rankedProgressFill" class="rankedProgressFill"></div>
        </div>
      </div>
    </div>

    <!-- TIMER -->
    <div id="timerBox" class="hidden">
      ⏱ <span id="timer">5</span>s
    </div>

    <div class="gameTopActions">
      <button id="backButton" class="menuButton compactBackButton" onclick="goBack()" aria-label="Torna alle modalità">
        <span aria-hidden="true">⇧</span>
      </button>
    </div>

    <!-- DOMANDA/TITOLO -->
    <div id="questionBox" class="questionBoxStrumenti">
      <span id="question"></span>
    </div>

    <!-- AREA GIOCO DINAMICA -->
    <div id="gameArea" class="gameAreaStrumenti gameVisualBox">
      <!-- Riempito dinamicamente da JS -->
    </div>

    <!-- FEEDBACK -->
    <div id="feedback" class="feedbackText"></div>

  </div>

</div>

<script src="../js/common.js?v=20260620-favicon"></script>
<script src="../js/giochi/ranked.js"></script>
<script src="../js/giochi/game_ui.js"></script>
<script src="../js/giochi/strumenti_game.js?v=20260620-central13"></script>
<script data-goatcounter="https://musicgamehub.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
